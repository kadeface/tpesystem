{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
<div style="padding: 20px;">
    <h2>导入任务状态</h2>
    <p>任务ID: {{ task_id }}</p>
    
    <div id="status-message" style="margin: 10px 0; padding: 10px; background: #f0f0f0; border: 1px solid #ccc;">
        正在加载...
    </div>
    
    <h3>导入日志:</h3>
    <pre id="log-container" style="height: 400px; overflow: auto; background: #f8f8f8; padding: 10px; font-family: monospace;">
        正在获取日志...
    </pre>
    
    <button onclick="window.location.reload()">刷新页面</button>
    <a href="{{ admin_index_url|default:'/admin/' }}">返回管理首页</a>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 获取任务ID
    const taskId = '{{ task_id }}';
    
    // 检查URL参数是否禁用API请求
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('no_api') && urlParams.get('no_api') === 'true') {
        document.getElementById('status-message').textContent = 'API请求已禁用';
        document.getElementById('log-container').textContent = '请使用刷新按钮手动查看最新状态';
        return;
    }
    
    // 立即查询一次状态
    fetch(`/api/task-status/?task_id=${taskId}`)
        .then(response => response.json())
        .then(data => {
            // 更新状态信息
            document.getElementById('status-message').textContent = 
                `状态: ${data.status} | 进度: ${data.progress}% | 已处理: ${data.processed_count || 0}条记录`;
            
            // 更新日志
            if (data.logs && data.logs.length > 0) {
                document.getElementById('log-container').textContent = data.logs.join('\n');
            } else {
                document.getElementById('log-container').textContent = '暂无日志信息';
            }
        })
        .catch(error => {
            document.getElementById('status-message').textContent = `获取状态出错: ${error}`;
            document.getElementById('log-container').textContent = '无法获取日志信息';
        });
});
</script>
{% endblock %}
